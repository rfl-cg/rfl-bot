packages:
  - apps/*
  - packages/*
  - e2e

# Versões únicas para o monorepo inteiro. Nos package.json, use "catalog:".
catalog:
  "@anthropic-ai/claude-agent-sdk": 0.3.311
  "@anthropic-ai/sdk": 1.3.0
  "@modelcontextprotocol/sdk": 1.32.2
  "@prisma/adapter-pg": 7.10.1
  "@prisma/client": 7.10.1
  baileys: 7.0.0-rc14
  bullmq: 6.5.0
  fastify: 5.12.7
  ioredis: 6.0.0
  pino: 10.4.0
  prisma: 7.10.1
  vite: 8.3.5
  vitest: 5.0.5
  zod: 4.6.7

# Não puxar o CLI do Prisma nem o TypeScript (peers opcionais do @prisma/client)
# para dentro das imagens de produção da api e do worker.
autoInstallPeers: false
dedupePeerDependents: false
resolvePeersFromWorkspaceRoot: false

peerDependencyRules:
  # Pedidos pelo Prisma Studio, que já vem com a interface pronta e funciona sem eles.
  ignoreMissing:
    - "@types/node"
    - "@types/react"
    - react
    - react-dom
    # Do Baileys: só para miniaturas de imagem. Mensagens de texto não precisam.
    - sharp

# Só os binários desta máquina (as imagens Docker usam Debian, com glibc).
# Evita baixar o CLI do Claude duas vezes (glibc e musl, ~280 MB cada).
supportedArchitectures:
  os: [current]
  cpu: [current]
  libc: [glibc]

onlyBuiltDependencies:
  - "@prisma/engines"
  - esbuild
  - prisma

ignoredBuiltDependencies:
  # Só confere a versão do Node (já garantida pelo .nvmrc e pela imagem Docker).
  - baileys
  # Acelerador nativo opcional do BullMQ; sem ele, usa a versão em JavaScript.
  - msgpackr-extract
  # Só mostra um aviso sobre a ferramenta de linha de comando dele.
  - protobufjs
