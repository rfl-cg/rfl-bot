# Produção na VPS (compartilhada com outros apps). Na pasta deploy/:
#   cp .env.example .env   (e preencha)
#   ./deploy.sh
#
# A API fica só em 127.0.0.1:3100. O proxy que já existe na VPS (Nginx, Caddy…)
# encaminha o domínio para ela. Para usar o Caddy incluso (VPS só do bot),
# coloque COMPOSE_PROFILES=caddy no .env.
name: rfl-bot

x-app-env: &app-env
  DATABASE_URL: postgresql://rflbot:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/rflbot
  REDIS_URL: redis://redis:6379
  RUNNER_URL: http://runner:4000
  APP_VERSION: ${APP_VERSION:-dev}

x-app: &app
  restart: unless-stopped
  env_file: .env
  environment: *app-env
  # internal: banco e Redis. runner: o computador dos bots. public: saída para a internet.
  networks: [internal, runner, public]
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy

services:
  api:
    <<: *app
    build:
      context: ..
      target: api
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    networks: [internal, public]
    ports:
      # Só na própria VPS. Se o proxy roda em Docker, use API_BIND=172.17.0.1 (README).
      - "${API_BIND:-127.0.0.1}:${API_PUBLIC_PORT:-3100}:3000"
    deploy:
      resources:
        limits:
          memory: 384M

  worker:
    <<: *app
    build:
      context: ..
      target: worker
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      runner:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M

  whatsapp:
    <<: *app
    build:
      context: ..
      target: whatsapp
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    volumes:
      # Sessão do WhatsApp Web: apagar este volume = parear de novo.
      - whatsapp-data:/data/whatsapp
    deploy:
      resources:
        limits:
          memory: 384M

  # O "computador dos bots": CLIs dos provedores, logins e pastas dos bots.
  # Sem env_file: não recebe a senha do banco, do Redis nem a ENCRYPTION_KEY.
  runner:
    build:
      context: ..
      target: runner
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN:?defina RUNNER_TOKEN no .env}
      RUNNER_MAX_CONCURRENT_TURNS: ${MAX_CONCURRENT_TURNS:-2}
      RUNNER_ENABLE_ECHO: ${RUNNER_ENABLE_ECHO:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_VERSION: ${APP_VERSION:-dev}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - runner-data:/data
    networks: [runner, public]
    deploy:
      resources:
        limits:
          memory: ${RUNNER_MEMORY_LIMIT:-1536M}

  migrate:
    build:
      context: ..
      target: migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://rflbot:${POSTGRES_PASSWORD}@postgres:5432/rflbot
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: rflbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: rflbot
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rflbot -d rflbot"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 768M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # BullMQ exige noeviction: o Redis nunca pode apagar jobs para liberar memória.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 256M

  # Opcional: só quando a VPS não tem outro proxy nas portas 80/443.
  caddy:
    profiles: [caddy]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal, public]
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  # Banco e Redis só nesta rede: sem acesso à internet e sem portas abertas.
  internal:
    internal: true
  # Worker e WhatsApp falam com o runner por aqui. O banco não está nesta rede.
  runner:
    internal: true
  public:

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  redis-data:
  runner-data:
  whatsapp-data:
